<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公共转写规则查询</title>
<style>body{background:#f5f6f3;color:#26372f;font:16px/1.65 system-ui,sans-serif;max-width:64rem;margin:auto;padding:1.5rem}input{font:inherit;width:100%;box-sizing:border-box;padding:.6rem}article{background:white;border:1px solid #dce2db;border-radius:.6rem;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}h2{font-size:1.2rem}</style>
<h1>公共转写规则查询</h1><p>共 14 条规则，含规则正文中的例句与辨析。出处仅供辨认，原件与独立例句库未随包提供。</p>
<label for="q">搜索编号、规则或例句</label><input id="q" type="search"><p id="count" role="status">14 条规则</p>
__RULES__
<script>
const input=document.querySelector('#q'), cards=[...document.querySelectorAll('[data-rule]')];
input.addEventListener('input',()=>{const terms=input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);let count=0;
for(const card of cards){card.hidden=!terms.every(t=>card.textContent.toLowerCase().includes(t));if(!card.hidden) count++;}
document.querySelector('#count').textContent=count+' 条规则';});
</script></html>
